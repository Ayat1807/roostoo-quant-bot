# strategy_bot configuration. CLI flags (--live / --dry-run / --max-cycles) override a few.

dry_run: true              # true = log intended orders only (default). Live needs --live or false here.
poll_s: 60                 # one ticker call (all pairs) per minute

# --- universe: checked at startup (must be crypto, CanTrade, and have live ticker data) ---
universe: [BTC/USD, ETH/USD, SOL/USD, BNB/USD, XRP/USD, ADA/USD, DOGE/USD, AVAX/USD, LINK/USD, DOT/USD]

# --- strategy plug-in (strategies/<name>.py) and its parameters ---
strategy:
  name: s3v2
  horizons: [24, 72, 168, 336]   # hours: 1d, 3d, 7d, 14d momentum
  vol_win: 336                   # 14-day realised volatility (hourly returns)
  regime_win: 336                # BTC regime: price vs its 14-day mean
  target_vol: 0.40               # per-asset annualised vol target (divided by N assets)
  short_scale_bull: 0.5          # shorts at half size while BTC > its 14-day mean
  max_w: 0.30                    # per-asset weight cap
  btc_pair: BTC/USD
  vol_method: ewma               # EWMA vol (strategy_lab block 2: e_ewma_vol, passed the final exam)
  ewma_halflife: 168             # hours (7 days)
  ewma_window: 800               # hourly returns used (= lab backtest lookback); "std" = old 14d vol

allow_short: true          # false: negative weights become 0 (fallback if /v6 is blocked)

# --- liquidity guard (default on): at each decision, skip pairs whose Roostoo spread is wider than
#     max_spread_bps or whose 24h volume (ticker UnitTradeValue) is below min_volume_usd; logged ---
liquidity_guard: {enabled: true, max_spread_bps: 15, min_volume_usd: 1000000}

# --- sleeves (optional; remove this block = single strategy above). Several strategies in one
#     account, each on its own virtual book (state/sleeves.json) and schedule; orders netted per coin
#     (see sleeves.py). Testing-key forward test from 2026-10-06: s3v2 0.5 + xsmom 0.5. ---
sleeves:
  - {name: s3v2, weight: 0.5, execution: band, decision_hour_utc: 0}   # strategy/universe/band from above
  - name: xsmom
    weight: 0.5
    strategy: {name: xsmom}                       # teammate's 24h cross-sectional momentum
    universe: [ZEC/USD, PAXG/USD, POL/USD, ICP/USD, TRX/USD, LISTA/USD, STO/USD, CAKE/USD, TUT/USD, SOL/USD]
    execution: scheduled                          # trades fully to target only at its decision
    decision_hour_utc: 15                         # decides on the 14:00 UTC bar (completes at 15:00)
# Block-3 winner under its fixed selection rule (strategy_lab/leaderboard_b3.md): xsmom alone on
# the teammate's 10 coins. NOT the current config. To use it, replace the sleeves block above with:
# sleeves:
#   - name: xsmom
#     weight: 1.0
#     strategy: {name: xsmom}
#     universe: [ZEC/USD, PAXG/USD, POL/USD, ICP/USD, TRX/USD, LISTA/USD, STO/USD, CAKE/USD, TUT/USD, SOL/USD]
#     execution: scheduled
#     decision_hour_utc: 15
# Caveats: no band sleeve, so no activity guard (about 12 active days per 14 in the backtest); the
# universe choice is in-sample for 2025-09 -> 2026-09 (see the selection-bias check).
capital_cap_usd: 10000     # size as if equity = min(actual, cap); null = full equity

# --- execution ---
rebalance_hour_utc: 0      # targets recomputed once a day (and at first start)
band: 0.06                 # only trade a pair if its weight is off target by > 6 pp
activity_guard_hour_utc: 20
# If nothing traded today by 20:00 UTC:
#   full    = rebalance every pair with a 1 pp band (current live behaviour)
#   minimal = ONE trade on the pair furthest from target, size min(gap, guard_max_frac)
#   off     = no guard (fails the one-trade-per-day rule on ~5 of 14 days)
# strategy_lab (2020-2026): minimal = best Sharpe, every day active; full adds +-20pp/yr
# path variance. Team decision 2026-10-05: minimal. No artificial round trip when the book
# is flat and all targets are 0 (KILL / hard brake stop): those days may stay inactive.
activity_guard: minimal
guard_band: 0.01           # used by `full`
guard_max_frac: 0.02       # used by `minimal`: max trade size as a fraction of sizing equity
entry_order: limit         # limit at our side of the touch (0.05% maker), market fallback
limit_wait_s: 300          # cancel unfilled limit after 5 min, MARKET the remainder
limit_poll_s: 15

# --- risk (drawdown brake ON; to be revisited vs kadoo69's finding) ---
dd_soft: -0.04             # equity vs rolling 14-day peak: halve exposure
dd_hard: -0.07             # go flat for cooloff_h, then reset the peak
cooloff_h: 24
peak_days: 14

# --- key safety ---
allow_competition: false   # ROOSTOO_KEY_LABEL=competition is refused unless true

# --- files (relative to strategy_bot/) ---
bootstrap_hours: 2000          # 2000 bars: xsmom's EMA168 matches the lab / teammate exactly
paths:
  log_dir: logs
  state_dir: state
  kill_file: KILL
bot_log:
  max_bytes: 5000000
  backups: 5
