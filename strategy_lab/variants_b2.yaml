# Research block 2 (team request 2026-10-05). ALL trials are declared here BEFORE any run.
# Goal: maximise 14-day returns without overfitting. Live bot untouched.
#
# PROTOCOL (fixed before running)
# * Holdout: 2026-07-01 -> latest data is the FINAL EXAM. Every run below ends 2026-06-30
#   23:00 UTC. The exam is run once, at the end, by `python -m lab.final_exam` (writes
#   runs/final_exam.lock and refuses to run twice).
# * Periods: in-sample 2020-02-15 -> 2024-12-31, OOS 2025-01-01 -> 2026-06-30.
# * Baseline = b2_core: the live config (s3v2, 1h, daily 00:00 targets, band 0.06, minimal
#   guard, brake on, shorts on, 10 coins), same window. Not a new trial (= trial 3).
# * "Beats live" = IS Sharpe > baseline IS Sharpe AND OOS Sharpe > baseline OOS Sharpe AND
#   OOS rolling-14d median composite >= baseline's. Only core replacements (D, E) and
#   core+satellite combos (C) are candidates; standalone satellites (B) are inputs to C.
# * Final exam (candidates that beat live only): pass = exam return >= baseline exam return
#   AND exam max drawdown no worse than baseline's by more than 5pp. Adopt only if both.
# * Trial counter: trials 34-206 (173 new; 177-206 = satellite round 2; 132-176 added 2026-10-05 for the literature
#   filters, declared before any B/C run); global declared trials = 33 + 143 = 176.
# * Satellite spread rule "<= 5 bps": Binance klines carry no spread, so it is proxied by
#   liquidity (30d mean daily volume >= $10M); today's Roostoo spreads of selected coins are
#   reported separately. Satellite pool = Roostoo's current crypto list (survivorship bias:
#   coins delisted from Roostoo are missing; flagged in the report).
# * Frequency sweep D: horizons fixed in calendar time (1/3/7/14 d; vol and regime windows
#   14 d). 15m and 30m use real 15m / 30m Binance bars; 2h and 4h use hourly bars with band
#   checks, trades and brake checks only every 2 / 4 hours (check_every_h).

declared_trials: 173
trial_offset: 33
baseline: b2_core

defaults:
  strategy: s3v2x
  universe: {type: list, assets: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT,
                                  ADAUSDT, DOGEUSDT, AVAXUSDT, LINKUSDT, DOTUSDT]}
  start: "2020-02-15"
  end: "2026-06-30 23:00"
  band: 0.06
  brake: true
  allow_short: true
  activity_guard: minimal
  params: {horizons: [24, 72, 168, 336], vol_win: 336, regime_win: 336, target_vol: 0.40,
           short_scale_bull: 0.5, max_w: 0.30, btc_pair: BTCUSDT}

runs:
  - {name: b2_core, group: base, strategy: s3v2, note: "baseline = live config (trial 3 re-run to 2026-06-30)"}
  # ---- D: frequency sweep (bar or check cadence x target refresh) -------------------
  - {name: d_15m_r24h, trial: 34, group: D, rebalance_every_h: 24, bar: 15m, lookback_bars: 1400, params: {horizons: [96, 288, 672, 1344], vol_win: 1344, regime_win: 1344, bars_per_year: 35040}}
  - {name: d_15m_r12h, trial: 35, group: D, rebalance_every_h: 12, bar: 15m, lookback_bars: 1400, params: {horizons: [96, 288, 672, 1344], vol_win: 1344, regime_win: 1344, bars_per_year: 35040}}
  - {name: d_15m_r6h, trial: 36, group: D, rebalance_every_h: 6, bar: 15m, lookback_bars: 1400, params: {horizons: [96, 288, 672, 1344], vol_win: 1344, regime_win: 1344, bars_per_year: 35040}}
