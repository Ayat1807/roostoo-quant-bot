# Research block 3: competition objective (team request 2026-10-06). ALL trials declared here
# BEFORE any run; trial counter continues (207-247, 41 new; global declared 206 + 41 = 247).
#
# PROTOCOL (fixed before running)
# * Runs go to the latest data, but are JUDGED ONLY on data to 2026-06-30, in both halves:
#   IS = start (2020-02-15) -> 2024-12-31, OOS = 2025-01-01 -> 2026-06-30. Jul 1 -> Oct 4 2026
#   (block-2 holdout, already spent) is reported as INFORMATIONAL ONLY, never a gate.
# * Primary metric: P(14d return >= +10%) and P(>= +8%) over rolling 14-day windows (daily step).
# * Constraints, each half: P(14d <= -10%) <= 10% AND worst 14d >= -20%.
# * Selection: highest OOS P(>= +10%) among runs meeting both constraints in both halves (ties:
#   higher IS P(>= +10%)). If none: s3v2e_tv06 on core10 if it qualifies, else s3v2e on core10.
#   If the winner is a regime switch or uses alt10 / core+alt (or xsmom / combos), it is
#   implemented in strategy_bot behind config flags with tests, not deployed.
# * Universes: core10 = live 10 coins; alt10 = ZEC NEAR SUI LTC UNI AAVE TAO ENA HBAR TRX
#   (each enters when its Binance history starts; BTC is loaded as the regime input only, never
#   traded, for s3v2-based and regime runs); core+alt = both (20 coins) sized as N=10
#   (n_divisor 10), gross <= 1; tm10 = the teammate's ZEC PAXG POL ICP TRX LISTA STO CAKE TUT SOL.
# * s3v2e = s3v2 with EWMA vol (halflife 168h), the live config since 47bb53d.
# * xsmom runs: execution "scheduled" (trade fully at the 14:00 UTC bar decision only, as the
#   strategy_bot sleeve), long only, brake on, activity guard off (the bot's minimal guard only
#   works on band sleeves); lookback 2000 bars (= the bot).
# * j (liquidity guard): Roostoo spread / 24h volume history does not exist, so the guard is
#   applied as of today: LISTA ($0.23M) and STO ($0.25M) fail the $1M floor -> tm10 minus both.
# * k "best of i": the i run with the highest OOS P(>= +10%) (ties: IS), resolved automatically
#   by the runner from data to 2026-06-30 (combo.satellite_from).
# * Selection-bias check for h: xsmom on tm10 also reported for 2023-01 -> 2025-09 (before the
#   teammate's sample), flagged as the out-of-sample test of the universe choice.

